# Nama berkas: .github/workflows/keep-supabase-alive.yml
name: Jaga Supabase Tetap Aktif

# Menjalankan satu permintaan ringan ke database setiap 3 hari,
# supaya Supabase tidak menganggap proyek ini menganggur
# (proyek gratis dijeda setelah 7 hari tanpa aktivitas).

on:
  schedule:
    # Setiap 3 hari, pukul 02:17 UTC (09:17 WIB)
    - cron: '17 2 */3 * *'
  workflow_dispatch:   # tombol "Run workflow" untuk menjalankan manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil database Supabase
        run: |
          echo "Menghubungi Supabase..."
          STATUS=$(curl -s -o /tmp/hasil.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/sections?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Kode status: $STATUS"
          echo "Balasan: $(cat /tmp/hasil.txt)"

          if [ "$STATUS" = "200" ]; then
            echo "Berhasil — proyek Supabase aktif."
          else
            echo "GAGAL — proyek mungkin sedang dijeda atau kredensial salah."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
